plugins {
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'war'
}

group = 'com.sc1hub'
version = '1.0.163-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.jsoup:jsoup:1.23.1'
	implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
	implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	providedRuntime 'org.apache.tomcat.embed:tomcat-embed-jasper'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('processResources') {
	exclude 'application-local.properties', 'application-online.properties'
}


tasks.named('bootRun') {
	systemProperty 'server.port', '8082'
}

tasks.register('verifyExternalTomcatWar') {
	group = 'verification'
	description = 'Verifies that the WAR is packaged for an external Jakarta Tomcat runtime.'
	dependsOn tasks.named('bootWar')

	doLast {
		def warFile = tasks.named('bootWar').get().archiveFile.get().asFile
		def zip = new java.util.zip.ZipFile(warFile)
		try {
			def entries = zip.entries().collect { it.name }
			def requireEntry = { String description, Closure<Boolean> predicate ->
				if (!entries.any(predicate)) {
					throw new GradleException("WAR is missing ${description}: ${warFile.name}")
				}
			}
			def rejectEntry = { String description, Closure<Boolean> predicate ->
				def unexpected = entries.find(predicate)
				if (unexpected != null) {
					throw new GradleException("WAR contains ${description}: ${unexpected}")
				}
			}

			requireEntry('MariaDB Connector/J') {
				it ==~ /WEB-INF\/lib\/mariadb-java-client-.*\.jar/
			}
			requireEntry('Jakarta JSTL implementation') {
				it ==~ /WEB-INF\/lib\/jakarta.servlet.jsp.jstl-.*\.jar/
			}
			requireEntry('provided Tomcat runtime') {
				it ==~ /WEB-INF\/lib-provided\/tomcat-embed-core-.*\.jar/
			}
			rejectEntry('an embedded Tomcat jar in WEB-INF/lib') {
				it ==~ /WEB-INF\/lib\/tomcat-embed-.*\.jar/
			}
			rejectEntry('the legacy MySQL JDBC driver') {
				it ==~ /WEB-INF\/lib\/mysql-connector-.*\.jar/
			}
			rejectEntry('a legacy Java EE servlet API') {
				it ==~ /WEB-INF\/lib\/javax\.servlet.*\.jar/
			}
		} finally {
			zip.close()
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyExternalTomcatWar')
}
