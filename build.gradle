plugins {
	id 'org.springframework.boot' version '3.1.12'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'war'
}

group = 'com.sc1hub'
version = '1.0.163-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// Cafe24 serves Tomcat 10.0.x (Servlet 5.0 / JSP 3.0). Spring Framework 6.0 keeps a
// Servlet 5.0 runtime baseline, so the build pins the 10.0 API rather than Boot's
// managed 10.1: compiling against Servlet 6.0 would let a 10.1-only call slip through.
ext['tomcat.version'] = '10.0.27'
def jakartaJstlVersion = '2.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

configurations {
	jspCompiler
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.jsoup:jsoup:1.23.1'
	// JSTL 2.0 is the Jakarta EE 9 release matching JSP 3.0. JSTL 3.0 targets EE 10 and
	// renames every taglib URI to jakarta.tags.*, which Tomcat 10.0 cannot resolve.
	// Its transitive Servlet/JSP/EL APIs are container-provided; Boot's dependency
	// management would otherwise resolve them to the Servlet 6.0 set Tomcat 10.0 lacks.
	implementation("jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:${jakartaJstlVersion}") {
		exclude group: 'jakarta.servlet', module: 'jakarta.servlet-api'
		exclude group: 'jakarta.servlet.jsp', module: 'jakarta.servlet.jsp-api'
		exclude group: 'jakarta.el', module: 'jakarta.el-api'
	}
	implementation("org.glassfish.web:jakarta.servlet.jsp.jstl:${jakartaJstlVersion}") {
		exclude group: 'jakarta.servlet', module: 'jakarta.servlet-api'
		exclude group: 'jakarta.servlet.jsp', module: 'jakarta.servlet.jsp-api'
		exclude group: 'jakarta.el', module: 'jakarta.el-api'
	}

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	runtimeOnly 'com.mysql:mysql-connector-j'
	providedCompile 'org.springframework.boot:spring-boot-starter-tomcat'
	// Jasper drags in ECJ 3.18, which does not know release 17 and silently downgrades the
	// JSP bytecode to 12. It is excluded here so it cannot precede the compiler below on
	// the JspC classpath; the server has its own copy and precompiling means none is used
	// at runtime anyway.
	providedRuntime('org.apache.tomcat.embed:tomcat-embed-jasper') {
		exclude group: 'org.eclipse.jdt', module: 'ecj'
	}
	jspCompiler 'org.apache.tomcat.embed:tomcat-embed-jasper'
	jspCompiler 'org.apache.ant:ant:1.10.12'
	jspCompiler 'org.eclipse.jdt:ecj:3.33.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// spring-test's MockHttpServletRequest implements the Servlet 6.0 interface, so the
	// mocks need that API even though production runs on Tomcat 10.0's Servlet 5.0.
	// Test-scoped only: the WAR must keep shipping no servlet API at all.
	testImplementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'java.awt.headless', 'true'
}

tasks.named('processResources') {
	exclude 'application-local.properties', 'application-online.properties'
}

def jspSourceDir = layout.projectDirectory.dir('src/main/webapp')
def generatedJspClassesDir = layout.buildDirectory.dir('generated/jsp-classes')
def generatedJspWebFragment = layout.buildDirectory.file('generated/jsp-web-fragment.xml')
def generatedJspWebXml = layout.buildDirectory.file('generated/jsp-web.xml')

tasks.register('precompileJsp', JavaExec) {
	group = 'build'
	description = 'Precompiles JSPs so the constrained Cafe24 JVM does not load ECJ at runtime.'
	dependsOn tasks.named('classes')

	inputs.files(fileTree(jspSourceDir) {
		include '**/*.jsp', '**/*.jspf'
	})
	inputs.files(configurations.jspCompiler)
	outputs.dir(generatedJspClassesDir)
	outputs.file(generatedJspWebFragment)

	classpath = sourceSets.main.runtimeClasspath + configurations.jspCompiler
	mainClass = 'org.apache.jasper.JspC'

	doFirst {
		delete generatedJspClassesDir
		delete generatedJspWebFragment
		generatedJspClassesDir.get().asFile.mkdirs()
		generatedJspWebFragment.get().asFile.parentFile.mkdirs()
		args = [
			'-uriroot', jspSourceDir.asFile.absolutePath,
			'-d', generatedJspClassesDir.get().asFile.absolutePath,
			'-webinc', generatedJspWebFragment.get().asFile.absolutePath,
			'-compile',
			'-source', '17',
			'-target', '17',
			'-javaEncoding', 'UTF-8'
		]
	}
}

tasks.register('generatePrecompiledJspWebXml') {
	group = 'build'
	description = 'Builds the deployment descriptor that maps JSP paths to precompiled servlets.'
	dependsOn tasks.named('precompileJsp')
	inputs.file(generatedJspWebFragment)
	outputs.file(generatedJspWebXml)

	doLast {
		def fragment = generatedJspWebFragment.get().asFile.getText('UTF-8')
		def webXml = generatedJspWebXml.get().asFile
		webXml.parentFile.mkdirs()
		webXml.setText("""<?xml version=\"1.0\" encoding=\"UTF-8\"?>
<web-app xmlns=\"https://jakarta.ee/xml/ns/jakartaee\"
		xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"
		xsi:schemaLocation=\"https://jakarta.ee/xml/ns/jakartaee https://jakarta.ee/xml/ns/jakartaee/web-app_5_0.xsd\"
		version=\"5.0\">
${fragment}
</web-app>
""", 'UTF-8')
	}
}

tasks.named('bootWar') {
	dependsOn tasks.named('generatePrecompiledJspWebXml')
	webXml = generatedJspWebXml.get().asFile
	layered {
		enabled = false
		includeLayerTools = false
	}
	from(generatedJspClassesDir) {
		into 'WEB-INF/classes'
		include '**/*.class'
	}
}

tasks.register('verifyProductionWarFootprint') {
	group = 'verification'
	description = 'Rejects development-only and container-provided dependencies from WEB-INF/lib.'
	dependsOn tasks.named('bootWar')

	doLast {
		def warFile = tasks.named('bootWar').get().archiveFile.get().asFile
		def zip = new java.util.zip.ZipFile(warFile)
		try {
			def entries = zip.entries().collect { it.name }
			// Shipping a container API overrides what Tomcat 10.0 implements: the Servlet 6.0
			// jar in particular advertises methods the container does not have.
			def forbiddenEntry = entries.find {
				it ==~ /WEB-INF\/lib(-provided)?\/spring-boot-devtools-.*\.jar/ ||
					it ==~ /WEB-INF\/lib\/tomcat-embed-.*\.jar/ ||
					it ==~ /WEB-INF\/lib\/ecj-.*\.jar/ ||
					it ==~ /WEB-INF\/lib\/javax\.servlet.*\.jar/ ||
					it ==~ /WEB-INF\/lib\/jakarta\.servlet-api-.*\.jar/ ||
					it ==~ /WEB-INF\/lib\/jakarta\.servlet\.jsp-api-.*\.jar/ ||
					it ==~ /WEB-INF\/lib\/jakarta\.el-api-.*\.jar/
			}
			if (forbiddenEntry != null) {
				throw new GradleException("Production WAR contains forbidden runtime dependency: ${forbiddenEntry}")
			}

			def requireEntry = { String description, Closure<Boolean> predicate ->
				if (!entries.any(predicate)) {
					throw new GradleException("Production WAR is missing ${description}")
				}
			}
			requireEntry('the Jakarta JSTL implementation') {
				it ==~ /WEB-INF\/lib\/jakarta\.servlet\.jsp\.jstl-.*\.jar/
			}
			requireEntry('the MySQL Connector/J driver') {
				it ==~ /WEB-INF\/lib\/mysql-connector-j-.*\.jar/
			}

			def jspSourceCount = fileTree(jspSourceDir) {
				include 'WEB-INF/views/**/*.jsp'
			}.files.size()
			def precompiledJspCount = entries.findAll {
				it ==~ /WEB-INF\/classes\/org\/apache\/jsp\/WEB_002dINF\/views\/.*_jsp\.class/
			}.size()
			if (precompiledJspCount != jspSourceCount) {
				throw new GradleException(
						"Production WAR precompiled ${precompiledJspCount} of ${jspSourceCount} JSPs")
			}

			def webXmlEntry = zip.getEntry('WEB-INF/web.xml')
			if (webXmlEntry == null) {
				throw new GradleException('Production WAR is missing WEB-INF/web.xml for precompiled JSP mappings')
			}
			def webXmlText = zip.getInputStream(webXmlEntry).getText('UTF-8')
			def mappedJspCount = (webXmlText =~ /<url-pattern>\/WEB-INF\/views\/.*?\.jsp<\/url-pattern>/).count
			if (mappedJspCount != jspSourceCount) {
				throw new GradleException(
						"Production WAR mapped ${mappedJspCount} of ${jspSourceCount} precompiled JSPs")
			}
		} finally {
			zip.close()
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyProductionWarFootprint')
}


tasks.named('bootRun') {
	systemProperty 'server.port', '8082'
}
