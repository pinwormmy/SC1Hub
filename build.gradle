plugins {
	id 'org.springframework.boot' version '2.7.18'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'java'
	id 'war'
}

group = 'com.sc1hub'
version = '1.0.163-SNAPSHOT'
sourceCompatibility = '1.8'
targetCompatibility = '1.8'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.2'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.jsoup:jsoup:1.23.1'
	implementation 'javax.servlet:jstl'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	runtimeOnly 'com.mysql:mysql-connector-j'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	providedRuntime 'org.apache.tomcat.embed:tomcat-embed-jasper'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'java.awt.headless', 'true'
}

tasks.named('processResources') {
	exclude 'application-local.properties', 'application-online.properties'
}


tasks.named('bootRun') {
	systemProperty 'server.port', '8082'
}

tasks.register('verifyExternalTomcatWar') {
	group = 'verification'
	description = 'Verifies that the WAR is packaged for an external Java EE Tomcat runtime.'
	dependsOn tasks.named('bootWar')

	doLast {
		def warFile = tasks.named('bootWar').get().archiveFile.get().asFile
		def zip = new java.util.zip.ZipFile(warFile)
		try {
			def entries = zip.entries().collect { it.name }
			def requireEntry = { String description, Closure<Boolean> predicate ->
				if (!entries.any(predicate)) {
					throw new GradleException("WAR is missing ${description}: ${warFile.name}")
				}
			}
			def rejectEntry = { String description, Closure<Boolean> predicate ->
				def unexpected = entries.find(predicate)
				if (unexpected != null) {
					throw new GradleException("WAR contains ${description}: ${unexpected}")
				}
			}

			requireEntry('MySQL Connector/J') {
				it ==~ /WEB-INF\/lib\/mysql-connector-j-.*\.jar/
			}
			requireEntry('JSTL implementation') {
				it ==~ /WEB-INF\/lib\/jstl-.*\.jar/
			}
			requireEntry('provided Tomcat runtime') {
				it ==~ /WEB-INF\/lib-provided\/tomcat-embed-core-.*\.jar/
			}
			rejectEntry('an embedded Tomcat jar in WEB-INF/lib') {
				it ==~ /WEB-INF\/lib\/tomcat-embed-.*\.jar/
			}
			rejectEntry('a Jakarta servlet API') {
				it ==~ /WEB-INF\/lib\/jakarta\.servlet.*\.jar/
			}
		} finally {
			zip.close()
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyExternalTomcatWar')
}
