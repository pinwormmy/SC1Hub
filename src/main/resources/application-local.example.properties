# Copy this file to application-local.properties and edit values for your machine.
# application-local.properties is git-ignored.

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/sc1hub_local?connectionTimeZone=LOCAL&sslMode=disable
spring.datasource.username=sc1hub_local
spring.datasource.password=change-me

mail.smtp.port=2525
mail.smtp.socketFactory.port=2525
mail.smtp.auth=false
mail.smtp.starttls.enable=false
mail.smtp.starttls.required=false
mail.smtp.socketFactory.fallback=true
AdminMail.id=
AdminMail.password=

path.upload.ck=.local-data/upload/
path.upload.img=.local-data/img/

# run-local.sh appends stricter safety overrides after this file.
sc1hub.gemini.apiKey=
sc1hub.gemini.allowLiveCalls=false
OPENAI_API_KEY=
sc1hub.openai.allowLiveCalls=false
sc1hub.assistant.bot.enabled=false
sc1hub.assistant.bot.autoPublishEnabled=false
sc1hub.assistant.bot.autoPublishCatchUpEnabled=false
sc1hub.assistant.rag.enabled=false
sc1hub.assistant.rag.autoUpdate.enabled=false

# 고수봇은 위 OPENAI_API_KEY로 GPT-5.6 Luna를 호출합니다.
# 웹 검색 도구와 사이트 내부 공략 글은 사용하지 않으며,
# 위 sc1hub.openai.allowLiveCalls와 assistant bot 기능 플래그가 모두 true일 때만 호출합니다.
# run-local.sh에서는 안전을 위해 항상 비활성화됩니다.
