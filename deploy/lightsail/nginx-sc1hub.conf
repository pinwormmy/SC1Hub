# SC1Hub front proxy on the Lightsail host. Installed by provision.sh as
# /etc/nginx/sites-available/sc1hub.
#
# The app decides the visitor IP and the plain-HTTP redirect from proxy headers (IpService,
# PlainHttpRedirectFilter), the way Cafe24's openresty sent them:
#   - TLS requests carry X-Forwarded-For with the real client appended last, and no X-Real-IP.
#   - X-Real-IP marks a plain-HTTP request, so it must never reach Tomcat from the TLS server.
# Plain HTTP is redirected here, so the app only ever sees TLS traffic.

# Site files are included in the http block, so this covers every server below.
server_tokens off;

upstream sc1hub_tomcat {
    server 127.0.0.1:8645;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name sc1hub.com www.sc1hub.com _;

    return 301 https://sc1hub.com$request_uri;
}

server {
    # Ubuntu 24.04 ships nginx 1.24, which predates the separate `http2 on;` directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sc1hub.com;

    include /etc/nginx/snippets/sc1hub-tls.conf;

    return 301 https://sc1hub.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name sc1hub.com;

    include /etc/nginx/snippets/sc1hub-tls.conf;

    # Spring multipart allows 10 MB per request; leave room for form fields.
    client_max_body_size 12m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;

    location / {
        proxy_pass http://sc1hub_tomcat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # Appends $remote_addr, so the right-most value is always the address nginx saw.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # An empty value drops any client-supplied X-Real-IP (it means "plain HTTP" to the app).
        proxy_set_header X-Real-IP "";

        # AI search calls an LLM with a 120 s client timeout.
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
    }
}
